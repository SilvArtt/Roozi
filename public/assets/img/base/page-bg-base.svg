<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF2"/>
      <stop offset="60%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F5F2EA"/>
    </linearGradient>

    <!-- grade de pontos discreta, repetida por toda a imagem -->
    <pattern id="baseDots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#D8CFBB" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#baseGrad)"/>
  <rect width="1600" height="900" fill="url(#baseDots)"/>

  <!-- manchas suaves apenas nos cantos, para não competir com conteúdo/formulários -->
  <circle cx="-60" cy="-60" r="260" fill="#F3E3B1" opacity="0.3"/>
  <circle cx="1660" cy="960" r="300" fill="#EDE7F3" opacity="0.28"/>
  <circle cx="1650" cy="-40" r="140" fill="#E4EEF6" opacity="0.3"/>
  <circle cx="-50" cy="950" r="150" fill="#F6DACB" opacity="0.28"/>

  <!-- uma única linha de rota bem discreta, quase imperceptível, mantendo a identidade da marca -->
  <path d="M-50 820 C 350 760, 650 880, 1000 800 S 1450 700, 1650 780"
        fill="none" stroke="#D3A22B" stroke-width="2" stroke-dasharray="1 14" stroke-linecap="round" opacity="0.18"/>
</svg>
