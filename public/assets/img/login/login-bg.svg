<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="loginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E1"/>
      <stop offset="55%" stop-color="#F9F2D8"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>
    <radialGradient id="loginGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3E3B1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F3E3B1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#loginGrad)"/>

  <!-- brilho suave atrás de onde o card de login fica -->
  <ellipse cx="800" cy="430" rx="480" ry="360" fill="url(#loginGlow)" opacity="0.6"/>

  <!-- formas de apoio nos cantos, longe do centro (onde fica o card) -->
  <circle cx="120" cy="120" r="150" fill="#EDE7F3" opacity="0.4"/>
  <circle cx="1480" cy="800" r="180" fill="#F6DACB" opacity="0.35"/>
  <circle cx="1500" cy="90" r="90" fill="#E4EEF6" opacity="0.4"/>
  <circle cx="90" cy="800" r="100" fill="#F3E3B1" opacity="0.35"/>

  <!-- rotas tracejadas contornando o centro -->
  <path d="M-50 700 C 250 620, 450 760, 750 690 S 1250 560, 1650 660"
        fill="none" stroke="#D3A22B" stroke-width="2.5" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.3"/>

  <path d="M-50 190 C 300 260, 550 100, 900 190 S 1350 280, 1650 150"
        fill="none" stroke="#7C98B3" stroke-width="2.5" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.3"/>

  <!-- paradas -->
  <circle cx="250" cy="628" r="6" fill="#D3A22B" opacity="0.5"/>
  <circle cx="1250" cy="568" r="6" fill="#D3A22B" opacity="0.5"/>
  <circle cx="550" cy="112" r="5" fill="#7C98B3" opacity="0.45"/>
  <circle cx="1350" cy="288" r="5" fill="#7C98B3" opacity="0.45"/>

  <!-- ícone de cadeado sutil, reforçando o tema de login -->
  <g transform="translate(1310,650) rotate(-6)" opacity="0.4">
    <rect x="0" y="20" width="64" height="46" rx="8" fill="none" stroke="#334E68" stroke-width="2.2"/>
    <path d="M12 20V12a20 20 0 0 1 40 0v8" fill="none" stroke="#334E68" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="32" cy="43" r="5" fill="#334E68" opacity="0.5"/>
  </g>

  <g transform="translate(160,700) rotate(8)" opacity="0.35">
    <rect x="0" y="16" width="52" height="38" rx="7" fill="none" stroke="#334E68" stroke-width="1.8"/>
    <path d="M10 16V10a16 16 0 0 1 32 0v6" fill="none" stroke="#334E68" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="26" cy="35" r="4" fill="#334E68" opacity="0.45"/>
  </g>
</svg>
