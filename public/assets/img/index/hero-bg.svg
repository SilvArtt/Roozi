<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E1"/>
      <stop offset="55%" stop-color="#F9F2D8"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bgGrad)"/>

  <!-- formas suaves de fundo distribuídas -->
  <circle cx="1480" cy="70" r="140" fill="#F3E3B1" opacity="0.45"/>
  <circle cx="60" cy="440" r="160" fill="#EDE7F3" opacity="0.4"/>
  <circle cx="1420" cy="450" r="100" fill="#F6DACB" opacity="0.35"/>
  <circle cx="150" cy="60" r="90" fill="#E4EEF6" opacity="0.4"/>
  <circle cx="800" cy="440" r="70" fill="#F3E3B1" opacity="0.3"/>

  <!-- rotas curvas, como trajetos de ônibus, cobrindo toda a altura -->
  <path d="M-50 400 C 250 320, 400 470, 700 380 S 1150 260, 1650 360"
        fill="none" stroke="#D3A22B" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.4"/>

  <path d="M-50 120 C 300 200, 500 40, 850 140 S 1300 230, 1650 90"
        fill="none" stroke="#7C98B3" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.35"/>

  <path d="M-50 250 C 200 220, 550 300, 900 230 S 1400 170, 1650 260"
        fill="none" stroke="#D96B43" stroke-width="2.5" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.3"/>

  <path d="M-50 460 C 300 420, 600 480, 950 430 S 1350 390, 1650 450"
        fill="none" stroke="#D3A22B" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round" opacity="0.25"/>

  <!-- paradas / pontos ao longo das rotas -->
  <circle cx="250" cy="330" r="7" fill="#D3A22B" opacity="0.55"/>
  <circle cx="700" cy="383" r="7" fill="#D3A22B" opacity="0.55"/>
  <circle cx="1150" cy="270" r="7" fill="#D3A22B" opacity="0.55"/>
  <circle cx="500" cy="70" r="6" fill="#7C98B3" opacity="0.5"/>
  <circle cx="1300" cy="200" r="6" fill="#7C98B3" opacity="0.5"/>
  <circle cx="900" cy="232" r="5" fill="#D96B43" opacity="0.45"/>
  <circle cx="350" cy="430" r="5" fill="#D3A22B" opacity="0.4"/>

  <!-- ícones sutis de cartão flutuando em cantos opostos -->
  <g transform="translate(1230,60) rotate(-8)" opacity="0.5">
    <rect x="0" y="0" width="80" height="52" rx="8" fill="#102A43" opacity="0.08"/>
    <rect x="0" y="0" width="80" height="52" rx="8" fill="none" stroke="#334E68" stroke-width="2" opacity="0.4"/>
    <rect x="9" y="13" width="28" height="6" rx="3" fill="#334E68" opacity="0.4"/>
    <rect x="9" y="24" width="46" height="5" rx="2.5" fill="#334E68" opacity="0.25"/>
  </g>

  <g transform="translate(140,320) rotate(10)" opacity="0.4">
    <rect x="0" y="0" width="70" height="46" rx="7" fill="#102A43" opacity="0.07"/>
    <rect x="0" y="0" width="70" height="46" rx="7" fill="none" stroke="#334E68" stroke-width="1.8" opacity="0.35"/>
    <rect x="8" y="11" width="24" height="5" rx="2.5" fill="#334E68" opacity="0.35"/>
    <rect x="8" y="21" width="40" height="4" rx="2" fill="#334E68" opacity="0.22"/>
  </g>
</svg>
