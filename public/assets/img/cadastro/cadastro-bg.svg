<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E1"/>
      <stop offset="55%" stop-color="#F9F2D8"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>
    <radialGradient id="cadGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6DACB" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F6DACB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#cadGrad)"/>

  <!-- brilho suave atrás de onde o card de cadastro fica -->
  <ellipse cx="800" cy="450" rx="520" ry="400" fill="url(#cadGlow)" opacity="0.55"/>

  <!-- formas de apoio nos cantos -->
  <circle cx="130" cy="780" r="170" fill="#EDE7F3" opacity="0.4"/>
  <circle cx="1470" cy="130" r="150" fill="#F3E3B1" opacity="0.4"/>
  <circle cx="1520" cy="820" r="90" fill="#E4EEF6" opacity="0.35"/>
  <circle cx="80" cy="130" r="80" fill="#F6DACB" opacity="0.35"/>

  <!-- rotas tracejadas, mais numerosas (tema de crescimento/onboarding) -->
  <path d="M-50 250 C 300 180, 500 340, 850 250 S 1300 130, 1650 230"
        fill="none" stroke="#D3A22B" stroke-width="2.5" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.32"/>

  <path d="M-50 650 C 300 720, 550 570, 900 660 S 1350 760, 1650 630"
        fill="none" stroke="#7C98B3" stroke-width="2.5" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.3"/>

  <path d="M-50 480 C 250 440, 600 520, 950 460 S 1400 400, 1650 470"
        fill="none" stroke="#D96B43" stroke-width="2" stroke-dasharray="1 12" stroke-linecap="round" opacity="0.25"/>

  <!-- paradas -->
  <circle cx="300" cy="185" r="6" fill="#D3A22B" opacity="0.5"/>
  <circle cx="1300" cy="135" r="6" fill="#D3A22B" opacity="0.5"/>
  <circle cx="550" cy="575" r="5" fill="#7C98B3" opacity="0.45"/>
  <circle cx="1350" cy="762" r="5" fill="#7C98B3" opacity="0.45"/>
  <circle cx="950" cy="463" r="4" fill="#D96B43" opacity="0.4"/>

  <!-- ícone de cartão e checklist, reforçando o tema de cadastro/onboarding -->
  <g transform="translate(1290,190) rotate(-10)" opacity="0.45">
    <rect x="0" y="0" width="84" height="54" rx="8" fill="none" stroke="#334E68" stroke-width="2"/>
    <rect x="10" y="14" width="30" height="6" rx="3" fill="#334E68" opacity="0.5"/>
    <rect x="10" y="26" width="48" height="5" rx="2.5" fill="#334E68" opacity="0.3"/>
  </g>

  <g transform="translate(150,600) rotate(7)" opacity="0.4">
    <rect x="0" y="0" width="56" height="70" rx="8" fill="none" stroke="#334E68" stroke-width="1.8"/>
    <path d="M12 18h32M12 32h32M12 46h20" stroke="#334E68" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <circle cx="8" cy="18" r="2.2" fill="#D3A22B" opacity="0.7"/>
    <circle cx="8" cy="32" r="2.2" fill="#D3A22B" opacity="0.7"/>
    <circle cx="8" cy="46" r="2.2" fill="#D3A22B" opacity="0.7"/>
  </g>
</svg>
